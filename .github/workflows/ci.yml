name: CI

on:
  push:
  pull_request:

jobs:
  playwright:
    name: Playwright Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Playwright_final_exam

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: Playwright_final_exam/playwright-report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: Playwright_final_exam/test-results

  api:
    name: API Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: API_FINAL

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run API tests
        run: mvn test
