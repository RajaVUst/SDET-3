name: UI and API Automation CI

on:
  push:
    branches:
      - Saiteja_Final_Assessment
  pull_request:
    branches:
      - Saiteja_Final_Assessment

jobs:
  ui-tests:
    name: Playwright UI Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: UI_Final_Assessment

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: UI_Final_Assessment/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        env:
          BASE_URL: ${{ secrets.saiteja_BASE_URL }}
          CARD_HOLDER_NAME: ${{ secrets.saiteja_CARD_HOLDER_NAME }}
          CARD_NUMBER: ${{ secrets.saiteja_CARD_NUMBER }}
          CARD_EXPIRY: ${{ secrets.saiteja_CARD_EXPIRY }}
          CARD_CVV: ${{ secrets.saiteja_CARD_CVV }}
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: UI_Final_Assessment/playwright-report

      - name: Upload UI Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UI_Final_Assessment/test-results

  api-tests:
    name: API Automation Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: API_Final_Assessment

    env:
      BASE_URL: ${{ secrets.saiteja_API_BASE_URL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run API Tests
        run: mvn clean test

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: API_Final_Assessment/target/allure-results