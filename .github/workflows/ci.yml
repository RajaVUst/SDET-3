name: Playwright Automation

on:
  push:
    branches:
      - Saiteja_Final_Assessment
  pull_request:
    branches:
      - Saiteja_Final_Assessment

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: UI_Final_Assessment

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: UI_Final_Assessment/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          CARD_HOLDER_NAME: ${{ secrets.CARD_HOLDER_NAME }}
          CARD_NUMBER: ${{ secrets.CARD_NUMBER }}
          CARD_EXPIRY: ${{ secrets.CARD_EXPIRY }}
          CARD_CVV: ${{ secrets.CARD_CVV }}
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: UI_Final_Assessment/playwright-report

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: UI_Final_Assessment/test-results