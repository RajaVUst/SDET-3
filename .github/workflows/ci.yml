name: Playwright and API CI

on:
  push:
    branches:
      - Capstone/304491-Vikram

  pull_request:
    branches:
      - Capstone/304491-Vikram

jobs:
  test:
    name: Run Playwright and API Tests
    runs-on: ubuntu-latest
    env:
      RETAILMART_BASE_URL: ${{ secrets.RETAILMART_BASE_URL }}
      RETAILMART_PAYMENT_CARDHOLDER: ${{ secrets.RETAILMART_PAYMENT_CARDHOLDER }}
      RETAILMART_PAYMENT_CARD_NUMBER: ${{ secrets.RETAILMART_PAYMENT_CARD_NUMBER }}
      RETAILMART_PAYMENT_CARD_EXPIRY: ${{ secrets.RETAILMART_PAYMENT_CARD_EXPIRY }}
      RETAILMART_PAYMENT_CARD_CVV: ${{ secrets.RETAILMART_PAYMENT_CARD_CVV }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_BASE_URL: ${{ secrets.TEST_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Cache Playwright node modules
        uses: actions/cache@v4
        with:
          path: Playwright/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('Playwright/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Playwright dependencies
        working-directory: Playwright
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Playwright
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: Playwright
        run: npx playwright test --reporter=github

      - name: Run API tests (RestAssured)
        working-directory: API
        run: mvn clean test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright/playwright-report/

      - name: Upload API Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: API/target/surefire-reports/