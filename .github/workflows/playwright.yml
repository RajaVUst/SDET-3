name: Playwright UI Automation

on:
  push:
    branches:
      - main
      - master
      - 272816_bhumika

  pull_request:
    branches:
      - main
      - master
      - 272816_bhumika

  workflow_dispatch:

jobs:
  ui-tests:
    name: Playwright UI Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Playwright_UI

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Playwright_UI/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" > .env

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright_UI/playwright-report/

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Playwright_UI/test-results/

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: Playwright_UI/evidence/screenshots/

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: Playwright_UI/logs/
  api-tests:
    name: API Automation Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: API_Final

    env:
      BASE_URL: ${{ secrets.API_BASE_URL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Create API .env
        run: |
          echo "BASE_URL=${{ secrets.API_BASE_URL }}" > .env

      - name: Run API Tests
        run: mvn clean test

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-surefire-reports
          path: API_Final/target/surefire-reports

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: API_Final/target/allure-results
